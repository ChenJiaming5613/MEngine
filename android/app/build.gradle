plugins {
     id 'com.android.application'
}

// CMake stages config.json, textures, environments, the configured glTF scene directories and compiled shaders here.
def mengineStagedAssetDir = layout.buildDirectory.dir("generated/mengine_assets").get().asFile

android {
    // SDLActivity and its helpers live in org.libsdl.app, so the namespace stays; applicationId is the app identity.
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion = "27.3.13750724"
    defaultConfig {
        applicationId "com.mengine.app"
        // libvulkan.so ships from API 24.
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static",
                    "-DMENGINE_STAGED_ASSET_DIR=${mengineStagedAssetDir.absolutePath.replace('\\', '/')}"
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
            assets.srcDir mengineStagedAssetDir
        }
        externalNativeBuild {
            cmake {
                path '../../CMakeLists.txt'
            }
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
